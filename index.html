aan tidak tertahan.", "Review bulanan dalam 15 menit: buka Rekap_Tim, urutkan dari skor terendah, baca kolom 'Prioritas perbaikan', lalu lanjut ke Scorecard_Individu untuk percakapan 1-on-1."]}}, {"id": "r15", "tab": "Content Creator", "type": "generic", "cfg": {"variants": ["CC Awareness", "CC Conversion"], "tab": "Content Creator", "title": "Content Creator", "mode": "individual", "max_bonus": 0.2, "max_bonus_txt": "20% gaji", "bands": [[0, 0], [70, 0.25], [80, 0.5], [90, 0.75], [100, 1.0]], "payout_txt": "Skor total < 70 = payout 0% | 70-79 = 25% | 80-89 = 50% | 90-99 = 75% | >= 100 = 100% dari bonus maksimal 20% gaji. Bonus akhir (% gaji) = payout x 20%. Contoh: skor 85 -> payout 50% -> bonus 10% gaji.", "steps": ["Atasan/HR membuka sheet Parameter: isi Periode mulai dan Periode selesai, cek bobot (total 100%), target/ambang, dan sel oranye yang berisi asumsi.", "Karyawan mengisi Log_Metrik setiap hari kerja (minimal mingguan) untuk metrik berbasis angka: pilih Metrik dari dropdown, isi Nilai A dan Nilai B sesuai kolom 'Arti A / B', lampirkan link bukti.", "Karyawan mengisi Log_Deliverable untuk setiap tugas/laporan yang punya deadline: isi Deadline, lalu isi Waktu selesai saat dikirim. Status Tepat Waktu / Terlambat terhitung otomatis.", "Atasan memverifikasi: isi kolom Verifikasi (Valid / Ditolak). Baris 'Ditolak' tidak dihitung ke KPI. Cukup sampling mingguan (filter Verifikasi = Belum dicek).", "Akhir periode: ketik nama di Rekap_Tim (persis sama dengan penulisan di log) dan gaji pokok bila ingin estimasi Rp. Cek kolom Kelengkapan data dan Prioritas perbaikan.", "Pakai Scorecard_Individu untuk sesi 1-on-1 dan Trend_Bulanan untuk melihat naik-turun performa 12 bulan.", "Untuk peran yang punya varian (mis. CC Awareness / CC Conversion), pilih varian saat mendaftarkan karyawan. Sub-KPI khusus varian hanya dihitung untuk karyawan dengan varian tersebut."], "cap": 100, "normalize": "Ya", "purpose": "Merencanakan eksekusi kreatif, memproduksi, dan mengembangkan konten video digital Kime Skincare berdasarkan strategi dan script yang disetujui, untuk mendukung pertumbuhan brand awareness maupun efektivitas komunikasi produk. Terdapat dua varian: CC Awareness (reach & attention) dan CC Conversion (CTR & CTOR).", "resp": ["A. Creative Content Production, B. Content Concept Execution, C. Hook & Content Delivery", "D. Awareness Content Execution, E. Conversion Content Execution", "F. Production Preparation, G. Creative Collaboration (Script Writer, Editor, AI Prompter, SMS)", "H. Creative Quality Control, I. Content Testing & Improvement, J. Reporting & Documentation"], "kpis": [{"name": "Content Performance Achievement", "weight": 30, "subs": [{"name": "Organic Reach (CC Awareness)", "w": 60, "src": "M", "method": "ratio", "T": 1.0, "tfmt": "pct", "a": "Actual Reach", "b": "Target Reach", "note": "Reach Score = min(100, Actual Reach / Target Reach x 100). Target 100% approved reach target.", "assumed": false, "only": "CC Awareness"}, {"name": "Video Attention (CC Awareness)", "w": 40, "src": "M", "method": "ratio", "T": 0.4, "tfmt": "pct", "a": "Completed Video Views", "b": "Eligible Video Starts", "note": "Completion Rate = Completed Video Views / Eligible Video Starts. Attention Score = min(100, Actual Completion Rate / Target Completion Rate x 100). Target rate (approved completion benchmark) belum berupa angka; 40% hanya placeholder.", "assumed": true, "only": "CC Awareness"}, {"name": "Video Product CTR (CC Conversion)", "w": 70, "src": "M", "method": "ratio", "T": 0.02, "tfmt": "pct2", "a": "Klik video produk", "b": "Impresi video produk", "note": "CTR Score = min(100, Actual CTR / Target CTR x 100). Target >= 100% target CTR; angka target CTR belum tertulis, 2% hanya placeholder.", "assumed": true, "only": "CC Conversion"}, {"name": "Video Product CTOR (CC Conversion)", "w": 30, "src": "M", "method": "ratio", "T": 0.1, "tfmt": "pct2", "a": "Klik video produk", "b": "Penayangan/open video produk", "note": "CTOR Score = min(100, Actual CTOR / Target CTOR x 100). Target >= 100% target CTOR; 10% hanya placeholder.", "assumed": true, "only": "CC Conversion"}]}, {"name": "Approved Content Production", "weight": 25, "subs": [{"name": "Approved Content (CC Awareness)", "w": 100, "src": "M", "method": "count", "T": 80, "tfmt": "int", "a": "Konten approved (jumlah)", "b": "(tidak dipakai)", "note": "Score = min(100, Approved Content / Target Content x 100). Target 80 konten per bulan.", "assumed": false, "only": "CC Awareness"}, {"name": "Approved Content (CC Conversion)", "w": 100, "src": "M", "method": "count", "T": 100, "tfmt": "int", "a": "Konten approved (jumlah)", "b": "(tidak dipakai)", "note": "Score = min(100, Approved Content / Target Content x 100). Target 100 konten per bulan.", "assumed": false, "only": "CC Conversion"}]}, {"name": "On-Time Production Delivery", "weight": 15, "subs": [{"name": "Approved Deliveries On-Time", "w": 100, "src": "D", "method": "ratio", "T": 0.95, "tfmt": "pct", "a": "Approved deliveries on-time", "b": "Total deliveries due", "note": "Delivery Rate = approved deliveries on-time / total deliveries due. Score = min(100, rate / 95% x 100).", "assumed": false}]}, {"name": "Content Quality & Creative Testing", "weight": 15, "subs": [{"name": "First-Pass Production QC", "w": 70, "src": "M", "method": "ratio", "T": 0.95, "tfmt": "pct", "a": "Konten lolos QC pertama", "b": "Total konten di-QC", "note": "Target >= 95%. KPI 4 = QC Score x 70% + Experiment Score x 30%.", "assumed": false}, {"name": "Approved Creative Experiments", "w": 30, "src": "M", "method": "count", "T": 6, "tfmt": "int", "a": "Eksperimen kreatif approved (jumlah)", "b": "(tidak dipakai)", "note": "Target >= 6 per bulan.", "assumed": false}]}, {"name": "Reporting & Documentation", "weight": 15, "subs": [{"name": "Laporan CC Harian Tepat Waktu", "w": 50, "src": "D", "method": "ratio", "T": 0.95, "tfmt": "pct", "a": "Laporan tepat waktu", "b": "Laporan wajib", "note": "Target >= 95% tepat waktu ng sehingga keterlambatan dan hambatan dapat diidentifikasi dan ditangani sebelum berdampak pada pelaksanaan.", "resp": ["A. Project Planning, B. Timeline & Milestone Management", "C. Event & Activation Execution, D. Project Readiness", "E. Cross-Functional Coordination, F. Vendor & Partner Management", "G. Risk & Issue Management, H. Budget Monitoring, I. Project Quality Control", "J. PR & Partnership Coordination, K. Project Documentation, L. Project Evaluation"], "kpis": [{"name": "Project Planning & Timeline Readiness", "weight": 30, "subs": [{"name": "On-Time Project Plan Submission", "w": 60, "src": "D", "method": "ratio", "T": 0.95, "tfmt": "pct", "a": "Valid plans submitted on-time", "b": "Total plans due", "note": "On-Time Rate = valid plans submitted on-time / total plans due. Plan SLA Score = min(100, rate / 95% x 100).", "assumed": false}, {"name": "Project Plan First-Pass QC", "w": 40, "src": "M", "method": "ratio", "T": 0.9, "tfmt": "pct", "a": "Checkpoints passed first submission", "b": "Total applicable checkpoints", "note": "QC Rate = checkpoints passed first submission / total applicable checkpoints. QC Score = min(100, rate / 90% x 100). 10 checkpoint wajib: objective & target audience; scope & deliverables; WBS; master timeline & milestone; dependencies & critical path; PIC/RACI; budget & resource; vendor/venue/material; risk mitigation & contingency; go-live readiness & evaluation plan.", "assumed": false}]}, {"name": "Milestone On-Time Achievement", "weight": 30, "subs": [{"name": "Weighted Milestone On-Time", "w": 100, "src": "M", "method": "ratio", "T": 0.95, "tfmt": "pct", "a": "Σ (bobot x milestone tepat waktu)", "b": "Σ (bobot x milestone jatuh tempo)", "note": "Weighted On-Time Rate = Σ (bobot x milestone on-time) / Σ (bobot x milestone due). KPI Score = min(100, rate / 95% x 100). Bobot kategori: Critical 3 (mis. venue lock, permit, technical readiness), Major 2 (vendor confirmation, POSM, talent), Standard 1 (administrasi, dokumentasi). Ambang 95% terbaca dari gambar kecil di tab.", "assumed": true, "cats": [["Critical", 3], ["Major", 2], ["Standard", 1]]}]}, {"name": "Event & Activation Readiness", "weight": 15, "subs": [{"name": "Readiness Rate (Gate)", "w": 100, "src": "M", "method": "ratio", "T": 1.0, "tfmt": "pct", "a": "Checks passed before gate", "b": "Total applicable checks", "note": "Readiness Rate = checks passed before gate / total applicable checks. KPI Score = min(100, Readiness Rate). Target 100% pada readiness gate yang ditetapkan, mis. H-1. 8 area cek: Venue & Permit; Audio, lighting, booth, peralatan; Talent/KOL; Visual & POSM; Product & Logistics; Rundown; Documentation; Contingency.", "assumed": false}]}, {"name": "Risk Management & Escalation SLA", "weight": 10, "subs": [{"name": "Risk / Issue Action Within SLA", "w": 70, "src": "D", "method": "ratio", "T": 0.95, "tfmt": "pct", "a": "Aksi risiko/isu dalam SLA", "b": "Total aksi risiko/isu jatuh tempo", "note": "Target >= 95%. Action Score = min(100, rate / 95% x 100) (dari gambar kecil di tab).", "assumed": false}, {"name": "Weekly Risk Review Completion", "w": 30, "src": "M", "method": "ratio", "T": 1.0, "tfmt": "pct", "a": "Weekly risk review selesai", "b": "Weekly risk review wajib", "note": "Review Score = completed / required weekly reviews x 100%. Target 100%.", "assumed": false}]}, {"name": "Reporting & Documentation", "weight": 15, "subs": [{"name": "Laporan Proyek Harian Tepat Waktu", "w": 50, "src": "D", "method": "ratio", "T": 0.95, "tfmt": "pct", "a": "Laporan tepat waktu", "b": "Laporan wajib", "note": "Target >= 95% tepat waktu (Daily report 09.00 D+1).", "assumed": false}, {"name": "Laporan Proyek Mingguan Tepat Waktu", "w": 30, "src": "D", "method": "ratio", "T": 1.0, "tfmt": "pct", "a": "Laporan tepat waktu", "b": "Laporan wajib", "note": "Target 100% tepat waktu.", "assumed": false}, {"name": "Laporan Proyek Bulanan Tepat Waktu", "w": 20, "src": "D", "method": "ratio", "T": 1.0, "tfmt": "pct", "a": "Laporan t
